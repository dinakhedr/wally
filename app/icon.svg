<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a6bff"/>
      <stop offset="1" stop-color="#5a34f0"/>
    </linearGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd36b"/>
      <stop offset="1" stop-color="#f5a524"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <!-- coin dropping in -->
  <circle cx="300" cy="150" r="62" fill="url(#coin)"/>
  <circle cx="300" cy="150" r="42" fill="none" stroke="#fff3cf" stroke-width="10" opacity=".8"/>
  <!-- wallet back flap -->
  <rect x="96" y="196" width="320" height="56" rx="24" fill="#c9bbff"/>
  <!-- wallet body -->
  <rect x="88" y="226" width="336" height="200" rx="40" fill="#ffffff"/>
  <!-- clasp -->
  <rect x="318" y="296" width="106" height="64" rx="32" fill="#ece6ff"/>
  <circle cx="352" cy="328" r="14" fill="#6d4aff"/>
</svg>
